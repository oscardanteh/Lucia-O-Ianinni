  @font-face { font-family:'Degular Display'; font-style:normal; font-weight:700; src:url('https://oscardanteh.github.io/Lucia-O-Ianinni/fonts/44524.otf') format('opentype'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:transparent; font-family:system-ui,sans-serif; overflow-x:hidden; }
  :root { --cw:380px; --ch:514px; --cx:190px; --cy:257px; --sw:551px; }
  .stage-wrap { width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:20px 0; }
  .stage { position:relative; width:var(--sw); height:var(--ch); perspective:1600px; flex-shrink:0; }
  .card {
    position:absolute; top:50%; left:50%;
    width:var(--cw); height:var(--ch);
    margin:calc(-1 * var(--cy)) 0 0 calc(-1 * var(--cx));
    border-radius:10px; overflow:hidden;
    box-shadow:0 12px 40px rgba(112,15,59,0.18), 0 3px 10px rgba(0,0,0,0.08);
    background:#efeae9;
    transition:transform 0.55s cubic-bezier(0.22,1,0.36,1), opacity 0.55s ease, filter 0.55s ease;
    will-change:transform,opacity;
  }
  .card iframe { width:100%; height:100%; border:0; display:block; pointer-events:none; }
  .card.flip { animation: flipIn 0.75s cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes flipIn { from { transform:rotateY(-90deg); } to { transform:rotateY(0deg); } }
  .controls { display:flex; align-items:center; justify-content:center; gap:18px; }
  .btn {
    width:42px; height:42px; border-radius:50%;
    border:1.5px solid rgba(112,15,59,0.45);
    background:rgba(255,255,255,0.92); color:rgba(112,15,59,1);
    font-family:'DegularDisplay-Bold','Degular Display','Degular',system-ui,sans-serif;
    font-weight:700; font-size:30px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1; padding:0 0 3px 0;
    -webkit-text-stroke:0.4px currentColor;
    transition:background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .btn:hover { background:rgba(112,15,59,0.08); border-color:rgba(112,15,59,0.7); }
  .btn:active { transform:scale(0.93); }
  .dots { display:flex; gap:8px; align-items:center; }
  .dot { width:7px; height:7px; border-radius:50%; background:rgba(112,15,59,0.22); cursor:pointer; transition:background 0.25s, transform 0.25s; }
  .dot.on { background:rgba(112,15,59,0.85); transform:scale(1.3); }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage"></div>

    <button class="btn" id="prev" aria-label="Anterior">&#8249;</button>

    var sel=framed?'#title-anim,#orbit-dots,.num-item,#sparkle,#desc-anim':'#card-svg,#title-anim,#orbit-dots,.num-item,#sparkle,#desc-anim';

   Galería

const CARDS_HTML = [T11, T02, T03, T04, T05];

/* ── Responsive sizing ──────────────────────────────────────────────── */
function applySize() {
  const cw = Math.max(230, Math.min(420, Math.round(window.innerWidth * 0.48)));
  const ch = Math.round(cw * (1150 / 850));
  const r  = document.documentElement;
  r.style.setProperty('--cw', cw + 'px');
  r.style.setProperty('--ch', ch + 'px');
  r.style.setProperty('--cx', Math.round(cw / 2) + 'px');
  r.style.setProperty('--cy', Math.round(ch / 2) + 'px');
  r.style.setProperty('--sw', (cw + Math.round(cw * 0.45)) + 'px');
  return cw;
}
let CW = applySize();
window.addEventListener('resize', () => { CW = applySize(); render(); });

const stage  = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const N      = CARDS_HTML.length;

const cards = CARDS_HTML.map((html, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const ifr = document.createElement('iframe');
  ifr.srcdoc = html;
  card.appendChild(ifr);
  stage.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.addEventListener('click', () => go(i));
  dotsEl.appendChild(dot);
  return { card, ifr };
});
const dots = [...dotsEl.querySelectorAll('.dot')];

let active = 0, visible = false;

function render() {
  const stackX = Math.round(CW * 0.068); // ≈26px cuando CW=380, se reduce en móvil
  cards.forEach(({ card }, i) => {
    const rel   = (i - active + N) % N;
    const depth = rel;
    const x     = -depth * stackX;
    const y     =  depth * 7;
    const s     =  1 - depth * 0.05;
    const rotY  =  depth * 5;
    card.style.transform    = `translate(${x}px,${y}px) scale(${s}) rotateY(${rotY}deg)`;
    card.style.opacity      = depth > 3 ? 0 : (1 - depth * 0.15);
    card.style.zIndex       = String(100 - depth);
    card.style.pointerEvents = rel === 0 ? 'none' : 'auto';
    card.onclick = rel === 0 ? null : () => go(i);
  });
  dots.forEach((d, i) => d.classList.toggle('on', i === active));
}

function triggerFront() {
  if (!visible) return;
  cards.forEach(({ card }) => card.classList.remove('flip'));
  const { card, ifr } = cards[active];
  void card.offsetWidth;
  card.classList.add('flip');
  if (ifr.contentWindow) ifr.contentWindow.postMessage('replay', '*');
}

function go(i) { active = ((i % N) + N) % N; render(); triggerFront(); }
function next() { go(active + 1); }
function prev() { go(active - 1); }

document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft')  prev();
});

let dragX = null;
stage.addEventListener('pointerdown', e => { dragX = e.clientX; });
window.addEventListener('pointerup', e => {
  if (dragX === null) return;
  const dx = e.clientX - dragX;
  if (dx < -40) next();
  else if (dx > 40) prev();
  dragX = null;
});

function setVisible(v) {
  const was = visible; visible = v;
  if (visible && !was) triggerFront();
}
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => setVisible(es[0].isIntersecting), { threshold: 0.15 }).observe(stage);
} else { visible = true; }

document.addEventListener('visibilitychange', () => { if (!document.hidden && visible) triggerFront(); });

render();
if (visible) triggerFront();
</script>
